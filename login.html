<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testbook Paper Room — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1EC;
    --card:#FCFCFA;
    --ink:#1C2B45;
    --ink-soft:#3B4A63;
    --muted:#6B7280;
    --line:#D6D2C4;
    --seal-red:#A8382F;
    --seal-green:#2F6B4F;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; font-size:15px; line-height:1.5;
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
    padding-top:max(24px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
  }
  ::selection{background:var(--ink); color:var(--paper);}
  button{font-family:inherit; cursor:pointer;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:400px; padding:0;
    box-shadow:0 2px 6px rgba(28,43,69,0.05);
    animation:rise .25s ease;
  }
  @keyframes rise{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  .card-top{
    text-align:center; padding:32px 28px 24px;
    border-bottom:1px solid var(--line);
  }
  .brand-mark{
    width:48px; height:48px; border:1.5px solid var(--ink); border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin-bottom:12px;
  }
  .card-top h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0 0 6px;
  }
  .card-top p{color:var(--muted); font-size:13px; margin:0;}

  .card-body{padding:24px 28px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:6px;
  }
  .field input{
    width:100%; border:1px solid var(--line); background:var(--paper);
    padding:12px; font-size:16px; font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink); border-radius:var(--radius); outline:none;
  }
  .field input:focus{border-color:var(--ink);}

  .error-msg{
    color:var(--seal-red); font-size:12.5px; margin-bottom:14px; min-height:18px;
    font-family:'IBM Plex Mono', monospace;
  }

  .btn{
    width:100%; border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    font-size:14px; padding:13px 18px; min-height:48px; cursor:pointer; letter-spacing:0.02em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .btn:hover{background:var(--ink-soft); border-color:var(--ink-soft);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  .remember-row{padding:2px 0 6px;}
  .check-label{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    font-size:13.5px; color:var(--ink-soft); padding:4px 0; width:fit-content;
  }
  .check-label input[type=checkbox]{
    width:17px; height:17px; accent-color:var(--ink); cursor:pointer; flex:none;
  }

  .card-foot{
    border-top:1px solid var(--line); padding:18px 28px;
    text-align:center;
  }
  .card-foot p{color:var(--muted); font-size:12px; margin:0;}

  @media (max-width:440px){
    body{padding:16px;}
    .card{max-width:100%;}
    .card-top{padding:26px 20px 20px;}
    .brand-mark{width:44px; height:44px; font-size:16px; margin-bottom:10px;}
    .card-top h1{font-size:18.5px;}
    .card-top p{font-size:12.5px;}
    .card-body{padding:20px;}
    .field{margin-bottom:14px;}
    .card-foot{padding:14px 20px;}
  }

  /* short / landscape viewports: trim vertical rhythm so the card + keyboard
     don't fight for space, and stop the page needing to scroll to see the button */
  @media (max-height:640px){
    body{align-items:flex-start; padding-top:max(16px, env(safe-area-inset-top));}
    .card-top{padding:20px 28px 16px;}
    .brand-mark{width:36px; height:36px; font-size:14px; margin-bottom:6px;}
    .card-top h1{font-size:17px; margin-bottom:4px;}
    .card-body{padding:18px 28px;}
    .field{margin-bottom:12px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <div class="brand-mark">TB</div>
    <h1>Testbook Paper Room</h1>
    <p>Sign in to browse &amp; download papers</p>
  </div>
  <div class="card-body">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="········" autocomplete="current-password">
    </div>
    <div class="remember-row">
      <label class="check-label">
        <input id="remember" type="checkbox">
        <span>Remember me</span>
      </label>
    </div>
    <div class="error-msg" id="error"></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </div>
  <div class="card-foot">
    <p>Testbook Paper Room &middot; Practice library</p>
  </div>
</div>

<script>
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const rememberEl = document.getElementById('remember');
const errEl = document.getElementById('error');
const btnEl = document.getElementById('loginBtn');

function showError(msg){ errEl.textContent = msg; }
function clearError(){ errEl.textContent = ''; }

// ── Restore saved credentials ────────────────────────────────────────────

const savedEmail = localStorage.getItem('tb_email');
const savedPass = localStorage.getItem('tb_pass');
if (savedEmail) {
  emailEl.value = savedEmail;
  if (savedPass) {
    passEl.value = savedPass;
    rememberEl.checked = true;
  }
}

// ── Auto-login: if we already have a valid token, skip to app ────────────

(async function autoLogin(){
  const existingToken = localStorage.getItem('tb_token');
  if (!existingToken) return;
  // Quick check: try hitting a protected endpoint
  try {
    const res = await fetch('/api/series', {
      headers: { 'Authorization': `Bearer ${existingToken}` }
    });
    if (res.ok) {
      window.location.href = '/app';
    } else {
      // Token expired — try with saved credentials
      if (savedEmail && savedPass) {
        const loginRes = await fetch('/api/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({email: savedEmail, password: savedPass}),
        });
        const data = await loginRes.json();
        if (loginRes.ok && data.token) {
          localStorage.setItem('tb_token', data.token);
          window.location.href = '/app';
          return;
        }
      }
      // Can't auto-login — show form
      localStorage.removeItem('tb_token');
    }
  } catch(e) {
    // Server might be down — show login form
  }
})();

// ── Login handler ────────────────────────────────────────────────────────

async function doLogin(){
  clearError();
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ showError('Please enter both email and password.'); return; }

  btnEl.disabled = true;
  btnEl.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await res.json();
    if(!res.ok || !data.token){
      showError(data.error || 'Invalid email or password.');
      btnEl.disabled = false;
      btnEl.textContent = 'Sign in';
      return;
    }
    // Store token
    localStorage.setItem('tb_token', data.token);
    // Always remember email
    localStorage.setItem('tb_email', email);
    // Remember password only if checkbox is checked
    if (rememberEl.checked) {
      localStorage.setItem('tb_pass', password);
    } else {
      localStorage.removeItem('tb_pass');
    }
    window.location.href = '/app';
  } catch(e){
    showError('Something went wrong. Contact binbard for support.');
    btnEl.disabled = false;
    btnEl.textContent = 'Sign in';
  }
}

btnEl.addEventListener('click', doLogin);
passEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
emailEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') passEl.focus(); });
</script>
</body>
</html>
